{% extends "base.html" %}

{% block title %}{{ title }} &middot; Admin &middot; ClipQueue{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ title }}</h1>
    </div>
</section>

{% include "_admin_nav.html" %}

<section class="section">
    <div class="container">
        <form class="form-card" method="post" action="{{ request.path }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ values.name }}" maxlength="100" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" maxlength="1000">{{ values.description }}</textarea>

            <label for="price">Price ({{ currency }})</label>
            <input type="number" id="price" name="price" value="{{ values.price }}"
                   min="0" max="99999.99" step="0.01" required>

            <label for="duration_minutes">Duration (minutes)</label>
            <input type="number" id="duration_minutes" name="duration_minutes"
                   value="{{ values.duration_minutes }}" min="5" max="480" required>

            <button type="submit" class="btn btn-primary">Save service</button>
            <a class="btn btn-outline" href="{{ url_for('admin.services') }}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
