{% extends "base.html" %}

{% block title %}Register &middot; ClipQueue{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Create an account</h1>
        <p>Sign up for a free customer account.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <form class="form-card" method="post" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" value="{{ full_name }}" maxlength="100" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" maxlength="120" required>

            <label for="password">Password (at least 8 characters)</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

            <button type="submit" class="btn btn-primary">Register</button>

            <p class="form-note">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
        </form>
    </div>
</section>
{% endblock %}
