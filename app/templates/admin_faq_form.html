{% extends "base.html" %}

{% block title %}{{ title }} &middot; Admin &middot; ClipQueue{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ title }}</h1>
    </div>
</section>

{% include "_admin_nav.html" %}

<section class="section">
    <div class="container">
        <form class="form-card" method="post" action="{{ request.path }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="question">Question</label>
            <input type="text" id="question" name="question"
                   value="{{ values.question }}" maxlength="200" required>

            <label for="answer">Answer</label>
            <textarea id="answer" name="answer" rows="5" maxlength="2000" required>{{ values.answer }}</textarea>

            <label for="sort_order">Display order (lower numbers show first)</label>
            <input type="number" id="sort_order" name="sort_order"
                   value="{{ values.sort_order }}" min="1" max="9999" step="1" required>

            <button type="submit" class="btn btn-primary">Save FAQ</button>
            <a class="btn btn-outline" href="{{ url_for('admin.faqs') }}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
