{% extends "base.html" %}

{% block title %}My Profile &middot; ClipQueue{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>My Profile</h1>
        <p>Update your details or change your password.</p>
    </div>
</section>

<section class="section">
    <div class="container">

        <form class="form-card" method="post" action="{{ url_for('auth.profile') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h2 class="section-title">Your details</h2>

            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name"
                   value="{{ full_name }}" maxlength="100" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ email }}" maxlength="120" required>

            <p class="form-note">Account type: {{ user.role|capitalize }}</p>

            <button type="submit" class="btn btn-primary">Save details</button>
        </form>

        <form class="form-card section-gap" method="post" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h2 class="section-title">Change password</h2>

            <label for="current_password">Current password</label>
            <input type="password" id="current_password" name="current_password"
                   autocomplete="current-password" required>

            <label for="new_password">New password (at least 8 characters)</label>
            <input type="password" id="new_password" name="new_password"
                   autocomplete="new-password" minlength="8" required>

            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   autocomplete="new-password" minlength="8" required>

            <button type="submit" class="btn btn-primary">Change password</button>
        </form>

    </div>
</section>
{% endblock %}
