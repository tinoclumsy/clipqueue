{% extends "base.html" %}

{% block title %}Log in &middot; ClipQueue{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Log in</h1>
        <p>Welcome back. Enter your email and password.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <form class="form-card" method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-primary">Log in</button>

            <p class="form-note">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </form>
    </div>
</section>
{% endblock %}
